name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generic MCP connection
        run: npm run mcp:select -- --reset

      - name: Sync official documentation (Contact Center + Customer Service)
        shell: pwsh
        run: ./scripts/sync-mdcc-docs.ps1

      - name: Unit tests
        run: npm test

      - name: Guardrails and agent context
        shell: pwsh
        run: |
          ./scripts/test-dataverse-mcp-guardrails.ps1
          ./scripts/test-playwright-guardrails.ps1
          ./scripts/test-agent-context.ps1

      - name: Build verified package
        shell: pwsh
        run: ./scripts/build-mdcc-package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mdcc-vscode-agent-suite
          path: mdcc-vscode-agent-suite.zip
          retention-days: 30
